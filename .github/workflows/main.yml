name: Build Hucks Show APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk HucksShow.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HucksShow
          path: HucksShow.apk

      - name: Publish release (gives a stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hucks Show build ${{ github.run_number }}
          files: HucksShow.apk
          make_latest: true
